<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocky World Maze (with Lighting)</title>
</head>
<body onload="main()">
<canvas id="webgl" width="600" height="400">
  Please use a browser that supports "canvas"
</canvas>
<p id="numdot">XXX</p>
<button type="button" id="animationYellowOnButton">Animation ON</button>
<button type="button" id="animationYellowOffButton">Animation OFF</button>
<button type="button" id="normalOn">Normal ON</button>
<button type="button" id="normalOff">Normal OFF</button>
<button type="button" id="lightOn">Light ON</button>
<button type="button" id="lightOff">Light OFF</button>
<button type="button" id="spotlightPos1">Spotlight ON</button>
<button type="button" id="spotlightPos2">Spotlight OFF</button>

<p>
Light X <input type="range" min="-250" max="250" value="0" class="slider" id="lightSlideX">
Light Y <input type="range" min="-250" max="250" value="100" class="slider" id="lightSlideY">
Light Z <input type="range" min="-250" max="250" value="-200" class="slider" id="lightSlideZ">

<p>
Light R <input type="range" min="0" max="255" value="255" class="slider" id="lightColorR">
Light G <input type="range" min="0" max="255" value="255" class="slider" id="lightColorG">
Light B <input type="range" min="0" max="255" value="200" class="slider" id="lightColorB">


<p>Camera Angle <input type="range" min="-180" max="180" value="0" class="slider" id="angleSlide"></p>
<p>Head Angle <input type="range" min="0" max="100" value="50" class="slider" id="redSlide"></p>
<p>Sheep Leg (1) <input type="range" min="-45" max="45" value="0" class="slider" id="yellowSlide"></p>
<p>Sheep Leg (2) <input type="range" min="-45" max="45" value="0" class="slider" id="magentaSlide"></p>
<p>Controls: W/A/S/D = Forward/Left/Back/Right &nbsp;|&nbsp; Q/E = Turn L/R &nbsp;|&nbsp; F = +Block &nbsp;|&nbsp; R = -Block</p>
<script src="../lib/webgl-utils.js"></script>
<script src="../lib/webgl-debug.js"></script>
<script src="../lib/cuon-utils.js"></script>
<script src="../lib/cuon-matrix.js"></script>
<script src="Camera.js"></script>
<script src="Triangle.js"></script>
<script src="Cube.js"></script>
<script src="Sphere.js"></script>
<script src="World.js"></script>
</body>
</html>
