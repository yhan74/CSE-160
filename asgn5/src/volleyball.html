function RenderDisplaySize(render) {
    const canvas = render.domElement;
    const cwidth = canvas.clientWidth, cheight = canvas.clientHeight;
    const modifySize = canvas.width !== cwidth || canvas.height !== cheight;
    if (modifySize) {
        render.setSize(cwidth, cheight, false);
    }
    return modifySize;
}

// Add textures
function tileTexture(c1,c2,tiles=8) {
    const size = 256;
    const tileSize = size/ tiles;
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const con = c.getContext('2d');
    for (let row = 0; row < tiles; row++) {
        for (let column = 0; column < tiles; column++) {
            const evenCheck = (row + column) % 2 === 0;
            if (evenCheck) {
                con.fillStyle = c1;
            } else {
                con.fillStyle = c2;
            }
            con.fillRect(column * tileSize, row * tileSize, tileSize, tileSize);
        }
    }
    const t_texture = new THREE.CanvasTexture(c);
    t_texture.colorSpace = THREE.SRGBColorSpace;
    t_texture.wrapS = THREE.RepeatWrapping;
    t_texture.wrapT = THREE.RepeatWrapping;
    return t_texture;
}
function woodTexture() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const con = c.getContext('2d');
    con.fillStyle = '#c8882a';
    con.fillRect(0,0,512,512);
    for (let i = 0; i < 80;i++) {
        const y = Math.random() * 512;
        const r = Math.floor(100+Math.random() * 60);
        const g = Math.floor(50 + Math.random() * 30);
        const b = 0;
        const a = 0.18;
        con.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
        const c1x = 128;
        const c1y = y + (Math.random() - 0.5) * 12;
        const c2x = 384;
        const c2y = y + (Math.random() - 0.5) * 12;

        con.lineWidth = 1 + Math.random() * 2;
        con.beginPath();
        con.moveTo(0,y);
        con.bezierCurveTo(c1x, c1y, c2x, c2y, 512, y);
        con.stroke();
    }
    const w_texture = new THREE.CanvasTexture(c);
    w_texture.colorSpace = THREE.SRGBColorSpace;
    w_texture.wrapS = THREE.RepeatWrapping;
    w_texture.wrapT = THREE.RepeatWrapping;
    w_texture.repeat.set(4,1);
    return w_texture;
}
function wallTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const con = c.getContext('2d');
    con.fillStyle = '#d4c8b0';
    con.fillRect(0,0,256,256);
    con.strokeStyle = '#b0a890';
    con.lineWidth = 1.5;
    const brickHeight = 32;
    const brickWidth = 64;
    const numRows = 256 / brickHeight;
    const numColumns = 256 / brickWidth;
    for (let row = 0; row < numRows; row++) {
        const oddCheck = row % 2 !== 0;
        const offset = oddCheck ? brickWidth / 2 : 0;
        for (let column = -1; column < numColumns + 1; column++) {
            const x = column * brickWidth + offset;
            const y = row * brickHeight;
            con.strokeRect(x, y, brickWidth, brickHeight);
        }
    }
    const wall_texture = new THREE.CanvasTexture(c);
    wall_texture.colorSpace = THREE.SRGBColorSpace;
    wall_texture.wrapS = THREE.RepeatWrapping;
    wall_texture.wrapT = THREE.RepeatWrapping;
    wall_texture.repeat.set(6,3);
    return wall_texture;
}
function metalTexture() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const con = c.getContext('2d');
    const g = con.createLinearGradient(0,0,128,0);
    g.addColorStop(0,'#888');
    g.addColorStop(0.4,'#ddd');
    g.addColorStop(0.6,'#aaa');
    g.addColorStop(1,'#888');
    con.fillStyle = g;
    con.fillRect(0,0,128,128);
    const m_texture = new THREE.CanvasTexture(c);
    m_texture.colorSpace = THREE.SRGBColorSpace;
    return m_texture;
}
function matTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const con = c.getContext('2d');
    con.fillStyle = '#1a6b3a';
    con.fillRect(0,0,256,256);
    const numDots = 5000;
    for (let i = 0; i < numDots; i++) {
        const dx = Math.random() * 256;
        const dy = Math.random() * 256;
        const a = Math.random() * 0.2;
        con.fillStyle = 'rgba(0, 0, 0, ' + a + ')';
        con.fillRect(dx,dy,1,1);
    }
    const mat_texture = new THREE.CanvasTexture(c);
    mat_texture.colorSpace = THREE.SRGBColorSpace;
    mat_texture.wrapS = THREE.RepeatWrapping;
    mat_texture.wrapT = THREE.RepeatWrapping;
    mat_texture.repeat.set(3,3);
    return mat_texture;
}
function vballTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const con = c.getContext('2d');
    con.fillStyle = '#f0ede8';
    con.fillRect(0,0,256,256);
    const pl = [['#1a4fa0',0,0,256,128], ['#c0290a',0,128,256,128]];
    pl.forEach(([c,x,y,w,h])=>{
        con.fillStyle=c;
        con.globalAlpha=0.18;
        con.fillRect(x,y,w,h);
        con.globalAlpha=1;
    });
    con.strokeStyle = '#333';
    con.lineWidth = 3;
    con.beginPath();
    con.moveTo(0,128);
    con.lineTo(256,128);
    con.stroke();
    con.beginPath();
    con.moveTo(128,0);
    con.lineTo(128,256);
    con.stroke();
    [[128,0], [0,128], [256,128], [128,256]].forEach(([cx,cy])=>{
        con.beginPath();
        con.arc(cx,cy,90,0,Math.PI*2);
        con.strokeStyle = '#555';
        con.lineWidth = 2;
        con.stroke();
    });
    const vball_texture = new THREE.CanvasTexture(c);
    vball_texture.colorSpace = THREE.SRGBColorSpace;
    return vball_texture;
}

// Create a simple Three.js scene (animated cubes)
function animatedCubes(color, letter) {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const con = c.getContext('2d');
    con.fillStyle = color; 
    con.fillRect(0,0,64,64);
    con.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    con.lineWidth = 4;
    con.strokeRect(4, 4, 56, 56);
    con.fillStyle = '#fff';
    con.font = 'bold 25px sans-serif';
    con.textAlign = 'center';
    con.fillText(letter, 32, 42);
    const cube_texture = new THREE.CanvasTexture(c);
    cube_texture.colorSpace = THREE.SRGBColorSpace;
    return cube_texture;
}

    cube.position.set(-10.5 + i*1.4, 12.5, -16);
    cube.castShadow = true;

    return cube;
});

// (1) serve volleyball (2) rally over net game
const scorekeep = document.querySelector('#scoreboard');
let serve_count = 0;
let rally_count = 0;
const WAITING = 0;
const SERVING = 1;
const RALLYING = 2;
const BOUNCING = 3;
const SERVE_BEGIN = {x: 0, y: 1.0, z: 6};
const SERVE_HIT = {x: (Math.random() - .5) *6, y: 0, z: -4};
const RALLEY_BACK  = {x: (Math.random() - .5) * 6, y: 0, z: 5};
let vballCondition = WAITING;
let vballT = 0;
let vballWaiting = 1.0;
let vballY = 0;
//let vball = 0;

function ballpassArc(start, end, arc_top, t) {
    return new THREE.Vector3(start.x + (end.x - start.x) * t, start.y + (end.y - start.y) * t + arc_top * 4 * t * (1-t), start.z + (end.z - start.z) * t);
}
let arcUp = {...SERVE_BEGIN}, arcDown = {...SERVE_HIT};
let arcHighestPt = 3.2;

volleyball.position.set(SERVE_BEGIN.x, SERVE_BEGIN.y, SERVE_BEGIN.z);

window.addEventListener('keydown', e => {
    if (e.code === 'Space' && vballCondition === WAITING) {
        vballCondition = SERVING;
        vballT = 0;
        arcUp = {x: 0, y: 1.0, z: 6};
        arcDown = {x: (Math.random() - .5) * 6, y: 0,z: -4};
        arcHighestPt = 3.2 + Math.random() * 0.8;
        serve_count++;
        e.preventDefault();
    }
});

// for the WOW feature: volleyball "match"
function vballChangePos() {
    if (vballCondition === WAITING) {
        vballY -= 0.006;
        vballWaiting += vballY;
        if (vballWaiting < 1.0) {
            vballWaiting = 1.0;
            vballY = Math.abs(vballY) * 0.55;
        }
        volleyball.position.set(arcUp.x, vballWaiting, arcUp.z);
        volleyball.rotation.x += 0.005;
    } else if (vballCondition === SERVING) {
        vballT += 0.016;
        const posit = ballpassArc(arcUp, arcDown, arcHighestPt, Math.min(vballT, 1));
        volleyball.position.copy(posit);
        volleyball.rotation.x += 0.12;
        volleyball.rotation.y += 0.06;
        if (vballT >= 1) {
            rally_count += 1;
            vballCondition = BOUNCING;
            vballT = 0;
            vballWaiting = 0.0;
            vballY = 0.18;
        }
    } else if (vballCondition === BOUNCING) {
        vballT += 0.016;
        vballY -= 0.022;
        vballWaiting += vballY;
        volleyball.position.y = Math.max(0.21, arcDown.y + vballWaiting);
        volleyball.rotation.x += 0.04;
        if (vballWaiting <= 0.0 && vballT > 0.2) {
            vballCondition = RALLYING;
            vballT = 0;
            arcUp = {...arcDown};
            arcDown = {x: (Math.random() - 0.5) * 6, y: 0, z: 5.5};
            arcHighestPt = 4.8 + Math.random() * 0.8;
            vballWaiting = 0;
            vballY = 0;
        }
    } else if (vballCondition === RALLYING) {
        vballT += 0.016;
        const posit = ballpassArc(arcUp, arcDown, arcHighestPt, Math.min(vballT, 1));
        volleyball.position.copy(posit);
        volleyball.rotation.x += 0.1;
        volleyball.rotation.y += 0.05;
        if (vballT >= 1) {
            rally_count += 1;
            vballCondition = WAITING;
            arcUp = {x: arcDown.x, y: 1.0, z: arcDown.z};
            vballWaiting = 1.0;
            vballY = 0;
        }
    }
    scorekeep.textContent = 'RALLY: ' + rally_count + ' | SERVES: ' + serve_count;
}

function timeRender(time) {
    time *= 0.001;
    //  resizeRendererToDisplaySize(renderer);
    if (RenderDisplaySize(render)) {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
    }
    create_cubes.forEach((cube, x2)=>{
        const speed = 1 + x2 * 0.1;
        const rotation = time * speed;
        cube.rotation.x= rotation; 
        cube.rotation.y= rotation;
        cube.position.y= 12.5 + Math.sin(time * 1.5 + x2 * 1.2) * 0.18;
    });
    net_grid.rotation.z = Math.sin(time * 0.7) * 0.005;
    vballChangePos(); //volleyball current changing position during game
    orbitControls.update();
    render.render(three_scene, camera);
    requestAnimationFrame(timeRender);
}
requestAnimationFrame(timeRender);
